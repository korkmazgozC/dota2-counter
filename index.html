<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dota 2 Counter</title>
  <meta name="description" content="Dota 2 counter pick, meta tier list ve stun/root/slow filtreli hero rehberi — mevcut patch verileriyle.">
  <meta name="theme-color" content="#0f1117">
  <meta name="color-scheme" content="dark">

  <!-- PWA / Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D2 Counter">

  <!-- Social preview -->
  <meta property="og:title" content="Dota 2 Counter">
  <meta property="og:description" content="Counter pick, meta ve hero filtreleri — mevcut patch.">
  <meta property="og:image" content="icons/icon-512.png">

  <link rel="preconnect" href="https://cdn.cloudflare.steamstatic.com" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/counter">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span data-i18n="appName">Dota 2 Counter</span>
    </a>
    <span id="patchBadge" class="badge"></span>
    <div id="bracketTop" class="top-bracket"></div>
  </header>
  <div class="offline-bar" data-i18n="offline"></div>

  <main id="view" class="view">
    <section class="card center loading"><div class="spinner"></div><p data-i18n="loading">Veriler yükleniyor…</p></section>
  </main>

  <nav class="nav" aria-label="Main"></nav>

  <div id="sheet" class="sheet" hidden data-act="closeSheet">
    <div class="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
